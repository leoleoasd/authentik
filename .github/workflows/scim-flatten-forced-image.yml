name: scim-flatten-forced-image

on:
  push:
    branches: [prod/scim-flatten-forced]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "/usr/local/.ghcup" /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)-scim-flatten-forced" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: lifecycle/container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/leoleoasd/authentik:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_BUILD_HASH=${{ github.sha }}
          cache-from: type=gha,scope=scim-flatten-forced
          cache-to: type=gha,mode=max,scope=scim-flatten-forced
